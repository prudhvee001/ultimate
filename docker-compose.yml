version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: java-login-page:latest   # Move image outside of build
    container_name: mpr-app
    ports:
      - "8080:8080"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:   
    driver: bridge
